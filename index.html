<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khayalan Digital — AI Virtual Office</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #080d18; color: #eaf2ff;
      font-family: Arial, sans-serif; overflow: hidden;
    }
    header {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 1px solid #243149;
      background: #0c1423;
    }
    .brand { font-weight: 800; letter-spacing: .5px; }
    .brand span { color: #54e3d1; }
    .status { color: #8da3bd; font-size: 12px; }
    main { display: grid; grid-template-columns: 1fr 300px; height: calc(100vh - 64px); }
    #office { position: relative; min-width: 0; overflow: hidden; }
    #scene { width: 100%; height: 100%; display: block; }
    .hint {
      position: absolute; left: 16px; bottom: 14px; padding: 9px 12px;
      border: 1px solid #263850; border-radius: 10px;
      background: #101a2bdc; color: #9fb2ca; font-size: 12px;
    }
    aside {
      border-left: 1px solid #243149; background: #0c1423;
      padding: 18px; overflow-y: auto;
    }
    h2 { margin: 0 0 8px; font-size: 18px; }
    .sub { color: #91a5bd; font-size: 12px; line-height: 1.5; }
    .staff {
      display: flex; align-items: center; gap: 10px; width: 100%;
      margin-top: 10px; padding: 12px; border: 1px solid #25354d;
      border-radius: 12px; background: #111d30; color: #eaf2ff;
      text-align: left; cursor: pointer;
    }
    .staff.active { border-color: #54e3d1; background: #142b38; }
    .avatar { font-size: 25px; }
    .staff small { display: block; color: #91a5bd; margin-top: 4px; }
    .chatbox {
      margin-top: 18px; border: 1px solid #25354d; border-radius: 12px;
      padding: 12px; background: #101a2b;
    }
    #chatlog { min-height: 90px; color: #b8c8dc; font-size: 13px; line-height: 1.5; }
    .chatrow { display: flex; gap: 6px; margin-top: 10px; }
    input {
      width: 100%; min-width: 0; padding: 10px; border-radius: 8px;
      border: 1px solid #30415b; background: #080f1d; color: white;
    }
    button.send {
      border: 0; border-radius: 8px; padding: 0 12px;
      background: #54e3d1; color: #06201f; font-weight: bold;
    }
    .tag {
      display: inline-block; margin-top: 16px; padding: 6px 9px;
      border-radius: 20px; background: #162b3b; color: #54e3d1; font-size: 11px;
    }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
      aside { border-left: 0; border-top: 1px solid #243149; padding: 12px; }
      header { padding: 0 12px; }
      .status { font-size: 10px; }
      .staff { display: inline-flex; width: auto; margin-right: 5px; }
      .staff small { display: none; }
      .chatbox { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">KHAYALAN <span>DIGITAL</span></div>
    <div class="status">● AI VIRTUAL OFFICE &nbsp; | &nbsp; KHAYALAN GRUP</div>
  </header>

  <main>
    <section id="office">
      <canvas id="scene"></canvas>
      <div class="hint">Pilih karakter atau ruangan untuk melihat detail.</div>
    </section>

    <aside>
      <h2>Virtual Office</h2>
      <div class="sub">Kantor digital Khayalan Digital. Pilih staf AI untuk memulai percakapan.</div>
      <div class="tag">● 4 AI STAFF</div>

      <div id="stafflist"></div>

      <div class="chatbox">
        <strong id="chatname">Pilih staf AI</strong>
        <div id="chatlog">Klik salah satu staf di atas atau karakter di dalam kantor.</div>
        <div class="chatrow">
          <input id="message" placeholder="Tulis pesan..." />
          <button class="send" id="send">Kirim</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const staff = [
      { name: "Alya", role: "Project Manager", icon: "👩‍💻", color: 0x55d9ca, room: "Project Room" },
      { name: "Bima", role: "Web Developer", icon: "🤖", color: 0x658cff, room: "Development Room" },
      { name: "Nara", role: "UI/UX Designer", icon: "👩‍🎨", color: 0xffb45e, room: "Design Room" },
      { name: "Raka", role: "AI & Product Research", icon: "🧑‍🔬", color: 0xb58cff, room: "Innovation Lab" }
    ];
    let selected = 0;
    const list = document.getElementById("stafflist");

    staff.forEach((s, i) => {
      const b = document.createElement("button");
      b.className = "staff" + (i === 0 ? " active" : "");
      b.innerHTML = `<span class="avatar">${s.icon}</span><span><b>${s.name}</b><small>${s.role}</small></span>`;
      b.onclick = () => selectStaff(i);
      list.appendChild(b);
    });

    function selectStaff(i) {
      selected = i;
      document.querySelectorAll(".staff").forEach((b, n) => b.classList.toggle("active", n === i));
      document.getElementById("chatname").textContent = staff[i].name + " — " + staff[i].role;
      document.getElementById("chatlog").textContent =
        "Halo! Gue " + staff[i].name + ", " + staff[i].role + ". Ada yang bisa gue bantu?";
    }

    document.getElementById("send").onclick = sendMessage;
    document.getElementById("message").addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const input = document.getElementById("message");
      const msg = input.value.trim();
      if (!msg) return;
      document.getElementById("chatlog").textContent =
        "Lo: " + msg + "\n\n" + staff[selected].name +
        ": Pesan lo sudah gue terima. Fitur AI chat akan disambungkan pada tahap berikutnya.";
      input.value = "";
    }

    // Three.js office scene
    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x080d18);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080d18);

    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.set(12, 13, 15);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.HemisphereLight(0xb9d9ff, 0x243044, 2));
    const light = new THREE.DirectionalLight(0xffffff, 2.2);
    light.position.set(6, 12, 8);
    scene.add(light);

    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(14, 0.35, 10),
      new THREE.MeshStandardMaterial({ color: 0x1b2a40, roughness: 0.8 })
    );
    floor.position.y = -0.2;
    scene.add(floor);

    // Ruangan dan sekat
    function box(w, h, d, color, x, y, z) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.7 })
      );
      mesh.position.set(x, y, z);
      scene.add(mesh);
      return mesh;
    }

    // Dinding belakang dan sisi, menyisakan bagian depan terbuka
    box(14, 2.8, 0.25, 0x2d4662, 0, 1.2, -5);
    box(0.25, 2.8, 10, 0x2d4662, -7, 1.2, 0);
    box(0.25, 2.8, 10, 0x2d4662, 7, 1.2, 0);
    box(0.18, 2.1, 10, 0x38506a, 0, 0.9, 0);
    box(14, 2.1, 0.18, 0x38506a, 0, 0.9, 0);

    const names = ["PROJECT ROOM", "DEVELOPMENT", "DESIGN ROOM", "INNOVATION LAB"];
    const positions = [[-3.5, 0, -2.5], [3.5, 0, -2.5], [-3.5, 0, 2.5], [3.5, 0, 2.5]];
    const clickable = [];

    positions.forEach((p, i) => {
      // Meja
      box(2.3, 0.18, 1.2, 0x526a86, p[0], 0.75, p[2]);
      // Monitor
      box(0.9, 0.65, 0.12, 0x101927, p[0], 1.2, p[2] - 0.25);
      box(0.72, 0.45, 0.04, staff[i].color, p[0], 1.2, p[2] - 0.17);
      // Kursi
      box(0.65, 0.5, 0.65, 0x34445c, p[0], 0.35, p[2] + 1);
      // Karakter sederhana: badan, kepala, dan aksen warna
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.32, 0.42, 0.9, 12),
        new THREE.MeshStandardMaterial({ color: staff[i].color })
      );
      body.position.set(p[0], 0.65, p[2] + 0.65);
      body.userData.staffIndex = i;
      scene.add(body);
      clickable.push(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 16, 12),
        new THREE.MeshStandardMaterial({ color: 0xffd2ad })
      );
      head.position.set(p[0], 1.3, p[2] + 0.65);
      head.userData.staffIndex = i;
      scene.add(head);
      clickable.push(head);

      // Label ruangan
      const labelCanvas = document.createElement("canvas");
      labelCanvas.width = 512; labelCanvas.height = 128;
      const ctx = labelCanvas.getContext("2d");
      ctx.fillStyle = "#101a2b"; ctx.fillRect(0, 0, 512, 128);
      ctx.fillStyle = "#dff8ff"; ctx.font = "bold 36px Arial";
      ctx.textAlign = "center"; ctx.fillText(names[i], 256, 78);
      const texture = new THREE.CanvasTexture(labelCanvas);
      const label = new THREE.Mesh(
        new THREE.PlaneGeometry(2.4, 0.6),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true })
      );
      label.position.set(p[0], 2.25, p[2] - 0.65);
      scene.add(label);
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    canvas.addEventListener("pointerdown", e => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(clickable);
      if (hits.length) selectStaff(hits[0].object.userData.staffIndex);
    });

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
    selectStaff(0);
  </script>
</body>
</html>
